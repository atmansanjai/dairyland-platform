enum AccountStatus{
    ACTIVATED, INACTIVATED, SUSPENDED
}

enum UserRole{
    ADMIN, VENDOR, CUSTOMER
}

type User implements Node{
    id: ID!
    username : String!
    contactNumber :String!
    accountStatus : AccountStatus!
    userRole : UserRole!
    createdAt: DateTime!
    updatedAt: DateTime!
}

input UserFilter{
    accountStatus : AccountStatus
    userRole : UserRole
}

enum UserSortField{
    username
}

input userSort{
    order : SortOrder
    field : UserSortField
}

type UserEdge{
    cursor : String!
    node : User!
}

type UserConnection{
    edges : [UserEdge!]!
    pageInfo : PageInfo!
    totalCount : Int!
}

input UserQuery{
    id : ID
    contactNumber : String
}

type UserResponse{
    user : User
    error : ErrorResponse
}

extend type Query {
    users(
        first : Int
        last : Int
        after : String
        before: String
        filter : UserFilter
        search : String
        sort : userSort
    ): UserConnection!
    user(input : UserQuery):UserResponse!
}

type DeleteUserResponse{
    id : ID
    error : ErrorResponse
}

input UpdateUserDetailsInput{
    id : ID!
    username : String!
}

input UpdateAccountStatusInput{
    id : ID!
    accountStatus : AccountStatus!
}

input DeleteUserInput{
    id : ID!
}

extend type Mutation {
    updateAccountStatus(input : UpdateAccountStatusInput!) : UserResponse!
    deleteUser(input : DeleteUserInput) : DeleteUserResponse!
    updateUserDetails(input : UpdateUserDetailsInput!) :  UserResponse!
}
